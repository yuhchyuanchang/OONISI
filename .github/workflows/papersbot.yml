name: post-to-teams

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"  # 6時間ごと（好きに変更）

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: POST to Power Automate (Teams)
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          test -n "$TEAMS_WEBHOOK_URL" || (echo "❌ Secret empty" && exit 1)
          curl -sS -X POST "$TEAMS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"user_name\":\"GitHub Actions\",\"feedback_message\":\"テスト通知\",\"timestamp\":\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\",\"host\":\"github-actions\"}"
