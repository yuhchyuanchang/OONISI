name: Test Teams Webhook

on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Post test message to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          if [ -z "$TEAMS_WEBHOOK_URL" ]; then
            echo "❌ Secret is empty"
            exit 1
          fi

          curl -sS -X POST "$TEAMS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data-raw '{"user_name":"GitHub Actions","feedback_message":"Secrets 動作確認テスト 🎉","timestamp":"'"$(date -u +"%Y-%m-%d %H:%M:%S UTC")"'","host":"github-actions"}'
