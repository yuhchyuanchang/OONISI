name: PapersBot to Teams

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"   # 毎日 UTC 01:00（日本時間 10:00）

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run PapersBot
        run: |
          python papersbot.py > output.txt

      - name: Post result to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          if [ ! -s output.txt ]; then
            echo "No output from PapersBot"
            exit 0
          fi

          MESSAGE=$(sed ':a;N;$!ba;s/\n/\\n/g' output.txt)

          curl -sS -X POST "$TEAMS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data-raw "{\"user_name\":\"PapersBot\",\"feedback_message\":\"$MESSAGE\",\"timestamp\":\"$(date -u +'%Y-%m-%d %H:%M:%S UTC')\",\"host\":\"github-actions\"}"
