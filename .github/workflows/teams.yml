name: PapersBot -> Teams

on:
  schedule:
    - cron: "0 9 * * *"   # 毎日 09:00 UTC（日本時間 18:00）
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run PapersBot and notify Teams
        shell: bash
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          set -x

          # Secret チェック
          test -n "${TEAMS_WEBHOOK_URL:-}" || { echo "❌ Secret empty"; exit 1; }

          # Python 依存関係
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

          # 実行環境の確認
          echo "=== pwd ==="
          pwd
          echo "=== ls -la ==="
          ls -la

          # stdout + stderr をまとめて log.txt に保存
          export PYTHONFAULTHANDLER=1
          python -u -X faulthandler papersbot.py --do-not-tweet > log.txt 2>&1 || {
            code=$?
            echo "❌ papersbot.py failed (exit=$code)"
            echo "=== last 200 lines of log.txt ==="
            tail -n 200 log.txt || true
            exit $code
          }

          echo "=== last 50 lines of log.txt (success) ==="
          tail -n 50 log.txt || true

          # Teams に送る JSON を作成
          python - <<'PY' > payload.json
          import json, datetime
          msg = open("log.txt", "r", encoding="utf-8", errors="replace").read().strip()
          payload = {
            "user_name": "PapersBot",
            "feedback_message": msg if msg else "（新着なし）",
            "timestamp": datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC"),
            "host": "github-actions",
          }
          print(json.dumps(payload, ensure_ascii=False))
          PY

          # Teams Webhook（Power Automate）へ POST
          curl -sS --fail-with-body -X POST "$TEAMS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json

