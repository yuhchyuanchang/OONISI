name: PapersBot -> Teams

on:
  schedule:
    - cron: "0 0 * * *"   # 毎日 00:00 UTC = 09:00 JST
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run PapersBot and notify Teams
        shell: bash
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}   # ★追加（GitHub Secretsに登録）
        run: |
          set -euo pipefail
          set -x

          # Secret チェック
          test -n "${TEAMS_WEBHOOK_URL:-}" || { echo "❌ Secret empty"; exit 1; }

          # Python 依存関係
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

          # 実行環境の確認
          echo "=== pwd ==="
          pwd
          echo "=== ls -la ==="
          ls -la

          # stdout + stderr をまとめて log.txt に保存
          export PYTHONFAULTHANDLER=1
          python -u -X faulthandler papersbot.py --do-not-tweet > log.txt 2>&1 || {
            code=$?
            echo "❌ papersbot.py failed (exit=$code)"
            echo "=== last 200 lines of log.txt ==="
            tail -n 200 log.txt || true
            exit $code
          }

          echo "=== last 50 lines of log.txt (success) ==="
          tail -n 50 log.txt || true

          # Teams に送る JSON を作成
          python - <<'PY' > payload.json
          import json, datetime, re, os
          import requests

          text = open("log.txt", "r", encoding="utf-8", errors="replace").read()

          DEEPL_AUTH_KEY = os.getenv("DEEPL_AUTH_KEY", "").strip()

          def translate_ja(s: str) -> str:
              """DeepLで英→日。失敗したら空文字を返す（ワークフローは落とさない）"""
              if not DEEPL_AUTH_KEY:
                  return ""
              try:
                  r = requests.post(
                      "https://api-free.deepl.com/v2/translate",
                      data={
                          "auth_key": DEEPL_AUTH_KEY,
                          "text": s,
                          "target_lang": "JA",
                      },
                      timeout=15,
                  )
                  r.raise_for_status()
                  return r.json()["translations"][0]["text"].strip()
              except Exception:
                  return ""

          # "TWEET: <title> <url>" を抽出
          items = []
          seen_urls = set()

          for line in text.splitlines():
              line = line.strip()
              if not line.startswith("TWEET: "):
                  continue

              body = line[len("TWEET: "):].strip()

              # 末尾URLを取り出す
              m = re.match(r"(.+?)\s+(https?://\S+)$", body)
              if not m:
                  continue

              title = m.group(1).strip()
              url = m.group(2).strip()

              # ★重複排除（URLでユニーク化）
              if url in seen_urls:
                  continue
              seen_urls.add(url)

              # 原文を短く（翻訳前にやる）
              if len(title) > 140:
                  title = title[:137] + "..."

              # ★日本語＋原文を両方表示
              ja = translate_ja(title)
              if ja:
                  title_disp = f"{ja}\n({title})"
              else:
                  title_disp = title

              items.append((title_disp, url))

          # ===== 優先順 MOF→COF→CH4/methane→CO2→SF6→NH3 =====
          priority = [
              ("MOF", 100),
              ("COF", 90),
              ("CH4", 80),
              ("methane", 80),
              ("CO2", 70),
              ("SF6", 60),
              ("NH3", 50),
          ]

          def score(title_disp: str) -> int:
              # title_disp は「日本語\n(原文)」になりうるので、原文側にマッチしやすいが
              # 日本語に英字が消えるケースもあるため、両方見たいなら原文を持ち回す設計も可。
              t = title_disp.lower()
              s = 0
              for kw, w in priority:
                  if kw.lower() in t:
                      s += w
              return s

          items.sort(key=lambda x: score(x[0]), reverse=True)
          # ===== ここまで =====

          now = datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC")

          if items:
              msg_lines = [f"{i}. [{t}]({u})" for i, (t, u) in enumerate(items[:10], 1)]
              msg = "\n".join(msg_lines)
          else:
              msg = "（新着なし）"

          payload = {
            "user_name": "PapersBot",
            "feedback_message": msg,
            "timestamp": now,
            "host": "github-actions",
          }
          print(json.dumps(payload, ensure_ascii=False))
          PY

          # Teams Webhook（Power Automate）へ POST
          curl -sS --fail-with-body -X POST "$TEAMS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json

