name: PapersBot → Teams

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"   # UTC 00:00 = JST 09:00

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run PapersBot and post to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          test -n "$TEAMS_WEBHOOK_URL" || (echo "❌ Secret empty" && exit 1)

          # PapersBot 実行（出力を文字列として取得）
          MSG="$(python papersbot.py | jq -Rs .)"

          curl -sS -X POST "$TEAMS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"user_name\":\"PapersBot\",
              \"feedback_message\":$MSG,
              \"timestamp\":\"$(date -u +'%Y-%m-%d %H:%M:%S UTC')\",
              \"host\":\"github-actions\"
            }"
